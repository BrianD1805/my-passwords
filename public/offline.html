<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#336699" />
    <title>My Passwords — Offline</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 28px;
        background: #F7F5F2;
        color: #2A2A2A;
        font-family: Ubuntu, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 480px);
        padding: 32px;
        border: 1px solid rgba(102, 99, 95, .20);
        border-radius: 22px;
        background: #FFFFFF;
        text-align: center;
      }
      .mark {
        display: block;
        width: 92px;
        height: 92px;
        margin: 0 auto 20px;
        object-fit: contain;
      }
      h1 { margin: 0 0 12px; font-size: 26px; }
      p { margin: 0 0 20px; color: #66635F; line-height: 1.55; }
      button {
        min-height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        background: #336699;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      small { display: block; margin-top: 18px; color: #66635F; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/images/password-encrypt-brand.png" alt="My Passwords" />
      <h1>No internet connection</h1>
      <p>My Passwords could not finish loading. Reconnect, then try again. A vault already saved on this device will remain encrypted and unchanged.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <small>My Passwords Ver-0.047B</small>
    </main>
  </body>
</html>
