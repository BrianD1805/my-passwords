<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d3557" />
    <title>My Passwords — Offline</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 28px;
        background: #eaf4fb;
        color: #1d3557;
        font-family: Ubuntu, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 480px);
        padding: 32px;
        border: 1px solid #cbddea;
        border-radius: 22px;
        background: #fff;
        text-align: center;
      }
      .mark {
        display: grid;
        width: 54px;
        height: 54px;
        margin: 0 auto 18px;
        place-items: center;
        border-radius: 16px;
        background: #dcecf7;
        font-size: 26px;
      }
      h1 { margin: 0 0 12px; font-size: 26px; }
      p { margin: 0 0 20px; color: #526b7d; line-height: 1.55; }
      button {
        min-height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        background: #1d5f91;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      small { display: block; margin-top: 18px; color: #718797; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">MP</div>
      <h1>No internet connection</h1>
      <p>My Passwords could not finish loading. Reconnect, then try again. A vault already saved on this device will remain encrypted and unchanged.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <small>My Passwords Ver-0.043A</small>
    </main>
  </body>
</html>
