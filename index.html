<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#336699" />
    <meta name="description" content="Store passwords, secure notes, cards and encrypted documents in one private vault with protected backup and syncing." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="ubuntu-font-stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu:300,400,500,700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Capture Chromium's install event before the React module downloads so
      // onboarding Step 3 cannot miss the one-shot native install opportunity.
      window.__passwordEncryptInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__passwordEncryptInstallPrompt = event;
      });
      window.addEventListener('appinstalled', function () {
        window.__passwordEncryptInstallPrompt = null;
      });
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Password-Encrypt" />
    <meta property="og:title" content="Password-Encrypt | Encrypted Password Vault" />
    <meta property="og:description" content="Store passwords, secure notes, cards and encrypted documents in one private vault with protected backup and syncing." />
    <meta property="og:url" content="https://password-encrypt.com/" />
    <meta property="og:image" content="https://password-encrypt.com/images/password-encrypt-og.png" />
    <meta property="og:image:secure_url" content="https://password-encrypt.com/images/password-encrypt-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Password-Encrypt secure vault icon" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Password-Encrypt | Encrypted Password Vault" />
    <meta name="twitter:description" content="Store passwords, secure notes, cards and encrypted documents in one private vault with protected backup and syncing." />
    <meta name="twitter:image" content="https://password-encrypt.com/images/password-encrypt-og.png" />
    <title>Password-Encrypt | Encrypted Password Vault</title>
  </head>
  <body>
    <div id="root">
      <div id="startup-fallback" style="min-height:100vh;display:grid;place-items:center;padding:28px;background:#F7F5F2;color:#2A2A2A;font-family:Ubuntu,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
        <section style="width:min(100%,480px);padding:32px;border:1px solid rgba(102,99,95,.20);border-radius:22px;background:#FFFFFF;text-align:center;box-shadow:0 20px 55px rgba(42,42,42,.10);">
          <img src="/icons/splash-icon.png" alt="Password-Encrypt" style="display:block;width:92px;height:92px;margin:0 auto 20px;border-radius:50%;object-fit:cover;" />
          <h1 id="startup-fallback-title" style="margin:0 0 12px;font-size:26px;color:#2A2A2A;">Starting Password-Encrypt</h1>
          <p id="startup-fallback-message" style="margin:0;color:#66635F;line-height:1.55;">Loading your secure vault…</p>
          <button id="startup-fallback-retry" type="button" style="display:none;min-height:46px;margin:20px auto 0;padding:0 22px;border:0;border-radius:12px;background:#336699;color:#FFFFFF;font:inherit;font-weight:700;cursor:pointer;">Try again</button>
        </section>
      </div>
    </div>
    <script src="/startup.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
