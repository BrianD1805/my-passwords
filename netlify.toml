[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22.23.2"
  NPM_FLAGS = "--prefer-offline --no-audit --no-fund --progress=false"

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/vault"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."account-deletion-process"]
  schedule = "0 3 * * *"

[functions."customer-lifecycle-email-process"]
  schedule = "0 * * * *"

[functions."emergency-access-release-process"]
  schedule = "*/5 * * * *"

# Ver-0.052 retains the reliability monitoring schedules introduced in Ver-0.051.
[functions."operations-health-check"]
  schedule = "*/15 * * * *"

[functions."account-trial-check"]
  schedule = "*/30 * * * *"

[functions."operational-retention-cleanup"]
  schedule = "10 4 * * *"

[functions."database-backup-verify"]
  schedule = "30 5 * * *"

# Ver-0.050 security headers. CSP deliberately permits inline CSS because the
# current React UI uses style attributes; executable inline JavaScript is not permitted.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://flagcdn.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
