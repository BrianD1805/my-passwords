[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22.23.2"
  NPM_FLAGS = "--prefer-offline --no-audit --no-fund --progress=false"

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/vault"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."account-deletion-process"]
  schedule = "0 3 * * *"

[functions."customer-lifecycle-email-process"]
  schedule = "0 * * * *"

[functions."emergency-access-release-process"]
  schedule = "*/5 * * * *"
